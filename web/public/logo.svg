      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(40 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(80 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(120 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(160 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(200 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(240 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(280 200 200)"/>
      <path d="M200 22c18 0 32 14 32 32 0-18 14-32 32-32-22 8-32 28-32 48 0-20-10-40-32-48z" transform="rotate(320 200 200)"/>
    </g>
    <circle cx="200" cy="42" r="4.5"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(40 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(80 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(120 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(160 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(200 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(240 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(280 200 200)"/>
    <circle cx="200" cy="42" r="4.5" transform="rotate(320 200 200)"/>
  </g>

