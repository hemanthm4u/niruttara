<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Niruttara Organics</title>
  <g fill="none" stroke="#B33A2B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
