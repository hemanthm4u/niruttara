    <path d="
      M200 28
      C228 28 248 48 248 72
      C248 48 268 28 296 36
      C318 44 328 68 318 90
      C338 78 362 86 372 110
      C380 130 372 152 352 162
      C372 176 376 204 360 224
      C348 240 324 246 306 236
      C318 258 308 286 284 296
      C266 304 246 294 236 276
      C236 300 214 320 188 320
      C162 320 140 300 140 276
      C130 294 110 304 92 296
      C68 286 58 258 70 236
      C52 246 28 240 16 224
      C0 204 4 176 24 162
