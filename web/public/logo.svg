    <circle cx="238" cy="211" r="3.5"/>
    <line x1="242" y1="220" x2="242" y2="226"/>
    <line x1="254" y1="220" x2="254" y2="226"/>
    <ellipse cx="265" cy="218" rx="6" ry="4"/>
    <circle cx="260" cy="216" r="2.5"/>
    <!-- Chickens -->
    <circle cx="275" cy="226" r="2.8"/>
    <path d="M275 224l4-3"/>
    <circle cx="285" cy="228" r="2.5"/>
    <path d="M285 226l3-2"/>
    <circle cx="268" cy="230" r="2.2"/>
  </g>

