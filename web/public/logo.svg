    <rect x="194" y="178" width="12" height="19"/>
    <rect x="184" y="172" width="7" height="7"/>
    <rect x="209" y="172" width="7" height="7"/>
    <!-- Hills -->
    <path d="M130 205c18-12 36-12 50 0"/>
    <path d="M220 205c18-12 36-12 50 0"/>
    <!-- Sheep (left) -->
    <ellipse cx="145" cy="212" rx="6" ry="4"/>
    <circle cx="140" cy="210" r="2.5"/>
    <ellipse cx="158" cy="214" rx="5" ry="3.5"/>
    <circle cx="154" cy="212" r="2.2"/>
    <ellipse cx="150" cy="220" rx="5.5" ry="3.5"/>
    <circle cx="146" cy="218" r="2.2"/>
    <ellipse cx="164" cy="221" rx="4.5" ry="3"/>
    <circle cx="161" cy="219" r="2"/>
    <!-- Cow + calf (right) -->
